name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:cli
      # The sample files are tested with the Action itself: three files carry seeded defects and must fail, three must pass.
      - uses: ./
        with:
          config: samples/officeproof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: officeproof-reports
          path: officeproof-reports
