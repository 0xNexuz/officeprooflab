name: OfficeProof Lab
description: Test generated Office files (.xlsx, .docx, .pptx) in a pipeline. Formulas are recalculated with Univer, and only confirmed failures fail the build.
branding:
  icon: check-square
  color: red
inputs:
  config:
    description: Path to the list of test cases.
    default: officeproof.json
  out:
    description: Folder for the JSON, Markdown, JUnit and HTML reports.
    default: officeproof-reports
  url:
    description: Address of an OfficeProof Lab dashboard. Leave empty to keep the results in the build only.
    required: false
  token:
    description: A project token from the dashboard, passed from a repository secret.
    required: false
runs:
  using: composite
  steps:
    - name: Check the files
      shell: bash
      env:
        OFFICEPROOF_URL: ${{ inputs.url }}
        OFFICEPROOF_TOKEN: ${{ inputs.token }}
        OFFICEPROOF_CONFIG: ${{ inputs.config }}
        OFFICEPROOF_OUT: ${{ inputs.out }}
      run: |
        args=(check --config "$OFFICEPROOF_CONFIG" --out "$OFFICEPROOF_OUT" --no-color)
        if [ -n "$OFFICEPROOF_URL" ] && [ -n "$OFFICEPROOF_TOKEN" ]; then args+=(--upload); fi
        node "$GITHUB_ACTION_PATH/dist/officeproof.cjs" "${args[@]}"
